description: |-
  O curso superior de Tecnologia em Análise e Desenvolvimento de Sistemas da Cruzeiro do Sul Virtual oferece uma formação abrangente em engenharia de software e desenvolvimento de aplicações, contemplando tecnologias front-end e back-end, linguagens de programação como Python, Java, JavaScript e PHP, além de modelagem e gerenciamento de bancos de dados relacionais (SQL) e não relacionais (NoSQL). A formação também abrange metodologias ágeis, como Scrum e Kanban, práticas de DevOps e tecnologias emergentes, incluindo Inteligência Artificial, Big Data, Internet das Coisas (IoT) e Computação em Nuvem, preparando profissionais para projetar, desenvolver, implementar e manter soluções de software escaláveis e eficientes.

