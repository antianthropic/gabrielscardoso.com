degree: Technologist

course: System Analysis and Development

fieldOfStudy: Technology

school: Universidade Cruzeiro do Sul

description: |-
  The Technology in Systems Analysis and Development program at Cruzeiro do Sul Virtual provides comprehensive training in software engineering and application development, covering front-end and back-end technologies, programming languages such as Python, Java, JavaScript, and PHP, and relational (SQL) and non-relational (NoSQL) database management. The curriculum also emphasizes agile methodologies, including Scrum and Kanban, DevOps practices, and emerging technologies such as Artificial Intelligence, Big Data, Internet of Things (IoT), and Cloud Computing, preparing professionals to design, develop, and maintain scalable software solutions.

